# Assure: collects PostgreSQL facts in the customer's runner, sends them to the hosted Assure API over TLS with the
# customer's key, and writes the verdict the API returns. The check runs on Symbolia's server. Inputs reach entry.py
# through the environment only, the API key too (never on a command line); no expression appears inside the run
# script. The one action used is GitHub's actions/upload-artifact, pinned to a full sha; it cannot fail the Action.
name: Assure check
description: Check a PostgreSQL server against an Assure profile. Collects in your runner, checks on the Assure API, writes a verdict file.
author: Symbolia

inputs:
  mode:
    description: "api (the check runs on the Assure API), lint (a free pre-flight: the same local steps, then POST /v1/lint instead of a check; nothing is charged and no check runs), or local (in-runner, private distribution only)."
    required: false
    default: api
  api-key:
    description: Your Assure API key, from a secret such as secrets.ASSURE_API_KEY. Leave it empty when the job has id-token write permission; the Action then signs in with the workflow's GitHub identity.
    required: false
    default: ''
  api-url:
    description: The Assure API base URL (https only).
    required: false
    default: https://api.symbolia.ai
  profile:
    description: The checker profile to run.
    required: false
    default: postgresql-observed-baseline
  artefacts:
    description: "A directory of collected files (holding raw/, or raw/ itself). Set this or connection, never both. For http-observed-baseline with scope-binding empty, the directory holding your endpoint manifest (manifest.json and the response heads it names); the Action binds and collects it. For python-auth-declared-model leave both empty: the Action reads the checked-out repository (its Python files and requirements.md, and its dependency files in the runner, of which it sends the Flask-Login, Flask-HTTPAuth, Flask-JWT-Extended, flask-apispec, Flask-RESTful and Flask-User versions they pin, and the Flask-PageDown and Flask-SQLAlchemy versions only when they pin exactly a version Assure reads (Flask-PageDown 0.2.2, Flask-SQLAlchemy 2.2), as raw/LIBRARY-VERSIONS.json and, for a Django or FastAPI declaration, the requirements files its lock_locator entries name and, only where the check needs one, a lock file they name; see send-lock-files) and the declaration at .assure/declaration.json, and when there is none it drafts one and opens one pull request of its own proposing it (it never commits to your branches; the workflow needs contents: write and pull-requests: write)."
    required: false
    default: ''
  connection:
    description: A libpq keyword/value connection string (or postgresql:// URI) for PostgreSQL, or a mysql://user:pw@host:port/ URI (or mysql host=… port=… user=… password=…) for MySQL. Pass it from a secret.
    required: false
    default: ''
  declaration:
    description: The customer's MySQL declaration file (symbolia.mysql-declaration.v0). Required with a mysql connection; the file is read in the runner and its declared sections are carried into the submission verbatim. Refused with a PostgreSQL connection; for postgresql-declared-model in api mode the Action reads .assure/postgresql-declared-model.json, else .assure/declaration.json, in the checkout (a link, a linked .assure/ directory, a non-regular or an unreadable file is refused bad_input; a .assure/declaration.json whose schema is a string other than assure.postgresql.declaration/v1 is left to its own profile and named in one notice after the verdict's notices; one with no schema is read as before), and when there is none it drafts one and proposes it at .assure/postgresql-declared-model.json in a pull request of its own on assure/declaration-proposal (no draft, and bad_input for the missing declaration, when the collector's sidecar names no server major from 14 to 18).
    required: false
    default: ''
  collection-role:
    description: The collection role's name inside the database, which the collector checks against current_user. Defaults to the user in the connection. Set it when a connection pooler's login name (the user in the connection) differs, for example Supabase's <role>.<project-ref>.
    required: false
    default: ''
  collection-privileges:
    description: The read-only roles granted to the collection role, comma separated; pg_read_all_settings, pg_read_all_stats or both. The collector refuses broader roles such as pg_monitor.
    required: false
    default: pg_read_all_settings,pg_read_all_stats
  data-dir:
    description: A directory where the runner can read the server's data directory. Optional; used with connection.
    required: false
    default: ''
  config-dirs:
    description: Directories outside the data directory that hold the server's configuration files (for example /etc/postgresql/16/main), one per line or separated by colons. Optional; used with connection.
    required: false
    default: ''
  fail-on:
    description: "Statuses that fail the job, a comma list the API checks against the profile (any status but holds and vacuous, or not_collected), or never. unresolved-security (strict) also fails the job on an obligation the checker marks `security: true` that is not resolved."
    required: false
    default: fails
  allow-partial:
    description: Accepted for compatibility; it no longer changes the exit. A run in which some machines could not be read is green unless something is disproven, and the first line names what was not read.
    required: false
    default: 'false'
  scope:
    description: For a profile whose scope you select (not the PostgreSQL profiles), a JSON file holding the list of selected ids. Sent in the request body, never as a file. Leave empty otherwise.
    required: false
    default: ''
  scope-binding:
    description: For a profile that binds its selected scope, a JSON file holding the whole scope_binding object - the map from each selected id to its own token under the map name the API lists, and any record the profile lists. The Action checks its keys before collecting and sends it in the request body. Leave empty otherwise. For http-observed-baseline, leave it empty and the Action makes it from your endpoint manifest.
    required: false
    default: ''
  accepted-scope-ref:
    description: A reference to an accepted scope to compare against. No accepted scope record can be resolved yet, so the Action refuses it (bad_input) before anything is collected or sent; leave it empty for a first-run comparison.
    required: false
    default: ''
  identity-key:
    description: For http-observed-baseline, how the endpoint identity key reaches the identity producer. Only pipe - the Action makes a fresh key for each job and passes it on a pipe, so no key is ever an input, an environment variable or a file. Never paste a key here.
    required: false
    default: pipe
  report:
    description: The plain-language report of the check's claim tree, on by default in api mode (your account's plan must include it). It sends the verdict record, never your files, through OpenRouter to a model, asking for zero data retention, and the job summary and the pull request comment carry the report or the reason it was withheld. Set report to false to turn it off; local mode never asks for one. When the report cannot be written (your report balance or allowance is spent, no zero-retention endpoint can take the request, or the written text fails the deterministic fact check), the job summary keeps the deterministic verdict. The verdict, its file and the exit code never change.
    required: false
    default: ''
  allow-overage:
    description: "With the report on, true lets a report beyond your account's monthly allowance run, within its overage budget (overage is off until a budget is set), and its overage is charged at cost x 1.2. False (the default) refuses such a report (allowance_exhausted) unless your account's top-up covers it; nothing runs and nothing is charged."
    required: false
    default: 'false'
  feedback:
    description: A deliberate feedback note as one JSON object or a plain path to a UTF-8 JSON file written by the workflow, at most 16384 bytes. Empty is off. In api mode, after the check the Action sends one note with its server check id attached. A feedback error adds only a typed outcome to the job summary and never changes the verdict, outputs or exit. Local and lint modes do not read or send it.
    required: false
    default: ''
  requirements:
    description: "A requirements file to send with the check, api mode only (a path relative to the workspace). Unset (the default), the Action reads the repository-root requirements.md by default and sends its text; with no such file it sends none and says nothing, and a root file it cannot send (a symbolic link, beyond the bounds, not UTF-8 text) is not sent: the check runs and one notice says why. A file is sendable within 65536 bytes, 256 lines and 8192 bytes per line, as a regular UTF-8 file that is not a symbolic link. A named file that cannot be sent is bad_input (exit 2) before anything is sent. none sends no requirements text and prints no notice; the repository and the commit still go. The text is a request field, never a collected file; the repository and the commit (on a pull request, its head commit) go with it, and the server keeps them with the check for 30 days. Local mode does not read requirements."
    required: false
    default: ''
  compile-requirements:
    description: true (the default) lets the server send each requirements line it cannot match exactly, and only those lines, to Claude Haiku, which proposes the profile's statements the line asks for; the server then checks the proposal and decides the line itself, and the job summary says how many lines were read. False keeps every line from Claude Haiku, and the lines are matched exactly. API mode only.
    required: false
    default: 'true'
  send-lock-files:
    description: For python-auth-declared-model with a Django or FastAPI declaration. Unset (the default) sends the requirements files (requirements*.txt) the declaration's lock_locator entries name, and a lock file they name (Pipfile.lock, poetry.lock, uv.lock, pdm.lock) only when the check needs it, that is when no requirements file the declaration names pins that library; a lock file is sent whole, with every hash it records. true sends every lock file the lock_locator entries name; false sends none. Any other word is bad_input.
    required: false
    default: ''
  fresh-check:
    description: true sends a random Idempotency-Key, so the same bundle is checked, and charged, again. False (the default) derives the key from the content of the request, so a repeat of the same request gets the stored verdict back and is not charged again.
    required: false
    default: 'false'
  output:
    description: Where to write the verdict file.
    required: false
    default: assure-verdict.json
  python:
    description: The Python 3.14 interpreter to run the Action with.
    required: false
    default: python3

outputs:
  verdict-path:
    description: The path of the verdict file (or of the failure file).
    value: ${{ steps.assure.outputs.verdict-path }}
  outcome:
    description: verdict, no_verdict, or the typed failure outcome.
    value: ${{ steps.assure.outputs.outcome }}
  exit-code:
    description: The verdict's policy exit (0 nothing disproven or never, 1 something disproven or a status you chose to stop on, 3 could not look), 2 bad input or a missing, unknown or revoked key, 3 another typed refusal or an API failure.
    value: ${{ steps.assure.outputs.exit-code }}
  colour:
    description: "green (nothing disproven within the bounds the first line states); red (something disproven, a prove-class obligation not proven, a status you chose to stop on, an unresolved obligation under strict, bad input, or a missing, unknown or revoked key); yellow (could not look: nothing readable, the credit is spent, a rate limit, or another typed refusal)."
    value: ${{ steps.assure.outputs.colour }}
  not-established:
    description: How many obligations the check could not establish (each is named in the job summary). Empty for a failure.
    value: ${{ steps.assure.outputs.not-established }}
  requirements-not-established:
    description: With a requirements file sent, how many of its requirements are not established (each is named in the job summary). Empty otherwise.
    value: ${{ steps.assure.outputs.requirements-not-established }}
  requirements-disproven:
    description: With a requirements file sent, how many of its requirements are disproven. Empty otherwise.
    value: ${{ steps.assure.outputs.requirements-disproven }}
  declaration:
    description: "python-auth-declared-model, and postgresql-declared-model with a connection: unaccepted-draft when the check ran on a declaration drafted from the repository or the database, or on a pull request whose declaration is not yet on the base branch (the result is bounded by that draft until it is merged). Empty otherwise."
    value: ${{ steps.assure.outputs.declaration }}
  lint-findings:
    description: "With mode lint, how many problems the pre-flight found (0 means the upload is ready for a check). Empty otherwise."
    value: ${{ steps.assure.outputs.lint-findings }}
  report-status:
    description: With the report on, written, withheld, refused, or running (the report was still being written when the Action stopped waiting; open report-url later). Empty otherwise.
    value: ${{ steps.assure.outputs.report-status }}
  report-url:
    description: With the report on, the report page on the API (open it with your API key). Empty otherwise.
    value: ${{ steps.assure.outputs.report-url }}
  report-cost-usd:
    description: With the report on, what the report cost at the model's price, in USD. Empty otherwise.
    value: ${{ steps.assure.outputs.report-cost-usd }}
  report-charge-usd:
    description: With the report on, what the report was charged, in USD (0 within the monthly allowance). Empty otherwise.
    value: ${{ steps.assure.outputs.report-charge-usd }}
  report-allowance-remaining:
    description: With the report on, the report allowance left this month, in USD. Empty otherwise.
    value: ${{ steps.assure.outputs.report-allowance-remaining }}
  requirements-draft:
    description: "postgresql-observed-baseline: the path of assure-requirements-draft.md, the requirements draft written beside the verdict file, which the next step uploads as the assure-requirements-draft run artifact. Empty when nothing was drafted."
    value: ${{ steps.assure.outputs.requirements-draft }}

runs:
  using: composite
  steps:
    - id: assure
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_ARTEFACTS: ${{ inputs.artefacts }}
        INPUT_CONNECTION: ${{ inputs.connection }}
        INPUT_DECLARATION: ${{ inputs.declaration }}
        INPUT_COLLECTION_ROLE: ${{ inputs.collection-role }}
        INPUT_COLLECTION_PRIVILEGES: ${{ inputs.collection-privileges }}
        INPUT_DATA_DIR: ${{ inputs.data-dir }}
        INPUT_CONFIG_DIRS: ${{ inputs.config-dirs }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ALLOW_PARTIAL: ${{ inputs.allow-partial }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_SCOPE_BINDING: ${{ inputs.scope-binding }}
        INPUT_ACCEPTED_SCOPE_REF: ${{ inputs.accepted-scope-ref }}
        INPUT_IDENTITY_KEY: ${{ inputs.identity-key }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_FEEDBACK: ${{ inputs.feedback }}
        INPUT_ALLOW_OVERAGE: ${{ inputs.allow-overage }}
        INPUT_REQUIREMENTS: ${{ inputs.requirements }}
        INPUT_COMPILE_REQUIREMENTS: ${{ inputs.compile-requirements }}
        INPUT_FRESH_CHECK: ${{ inputs.fresh-check }}
        INPUT_SEND_LOCK_FILES: ${{ inputs.send-lock-files }}
        INPUT_OUTPUT: ${{ inputs.output }}
        ASSURE_PYTHON: ${{ inputs.python }}
        GITHUB_TOKEN: ${{ github.token }}
      run: '"$ASSURE_PYTHON" -I -B "$GITHUB_ACTION_PATH/action/entry.py"'
    - name: Upload the requirements draft
      if: ${{ always() && steps.assure.outputs.requirements-draft != '' }}
      continue-on-error: true
      # actions/upload-artifact v7
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: assure-requirements-draft
        path: ${{ steps.assure.outputs.requirements-draft }}
        overwrite: true
        if-no-files-found: warn
