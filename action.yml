# Assure: collects PostgreSQL facts in the customer's runner, sends them to the hosted Assure API over TLS with the
# customer's key, and writes the verdict the API returns. The check runs on Symbolia's server. Inputs reach entry.py
# through the environment only; no expression appears inside the run script. No third-party action is used. The API
# key reaches entry.py by environment only, never on a command line.
name: Assure check
description: Check a PostgreSQL server against an Assure profile. Collects in your runner, checks on the Assure API, writes a verdict file.
author: Symbolia

inputs:
  mode:
    description: api (the check runs on the Assure API) or local (in-runner, private distribution only).
    required: false
    default: api
  api-key:
    description: Your Assure API key. Pass it from a secret, for example secrets.ASSURE_API_KEY. Required in api mode.
    required: false
    default: ''
  api-url:
    description: The Assure API base URL (https only).
    required: false
    default: https://api.symbolia.ai
  profile:
    description: The checker profile to run.
    required: false
    default: postgresql-observed-baseline
  artefacts:
    description: A directory of collected files (holding raw/, or raw/ itself). Set this or connection, never both. For http-observed-baseline with scope-binding empty, the directory holding your endpoint manifest (manifest.json and the response heads it names); the Action binds and collects it.
    required: false
    default: ''
  connection:
    description: A libpq keyword/value connection string or a postgresql:// URI. Pass it from a secret.
    required: false
    default: ''
  collection-role:
    description: The collection role's name inside the database, which the collector checks against current_user. Defaults to the user in the connection. Set it when a connection pooler's login name (the user in the connection) differs, for example Supabase's <role>.<project-ref>.
    required: false
    default: ''
  collection-privileges:
    description: The read-only roles granted to the collection role, comma separated; pg_read_all_settings, pg_read_all_stats or both. The collector refuses broader roles such as pg_monitor.
    required: false
    default: pg_read_all_settings,pg_read_all_stats
  data-dir:
    description: A directory where the runner can read the server's data directory. Optional; used with connection.
    required: false
    default: ''
  config-dirs:
    description: Directories outside the data directory that hold the server's configuration files (for example /etc/postgresql/16/main), one per line or separated by colons. Optional; used with connection.
    required: false
    default: ''
  fail-on:
    description: Statuses that fail the job, a comma list the API checks against the profile (any status but holds and vacuous, or not_collected), or never.
    required: false
    default: fails
  allow-partial:
    description: true lets a run in which some machines could not be read meet the policy (exit 0 when no reading has a fail-on status). Default false, so such a run exits 3.
    required: false
    default: 'false'
  scope:
    description: For a profile whose scope you select (not the PostgreSQL profiles), a JSON file holding the list of selected ids. Sent in the request body, never as a file. Leave empty otherwise.
    required: false
    default: ''
  scope-binding:
    description: For a profile that binds its selected scope, a JSON file holding the whole scope_binding object - the map from each selected id to its own token under the map name the API lists, and any record the profile lists. The Action checks its keys before collecting and sends it in the request body. Leave empty otherwise. For http-observed-baseline, leave it empty and the Action makes it from your endpoint manifest.
    required: false
    default: ''
  accepted-scope-ref:
    description: A reference to an accepted scope to compare against. No accepted scope record can be resolved yet, so the Action refuses it (bad_input) before anything is collected or sent; leave it empty for a first-run comparison.
    required: false
    default: ''
  identity-key:
    description: For http-observed-baseline, how the endpoint identity key reaches the identity producer. Only pipe - the Action makes a fresh key for each job and passes it on a pipe, so no key is ever an input, an environment variable or a file. Never paste a key here.
    required: false
    default: pipe
  output:
    description: Where to write the verdict file.
    required: false
    default: assure-verdict.json
  python:
    description: The Python 3.14 interpreter to run the Action with.
    required: false
    default: python3

outputs:
  verdict-path:
    description: The path of the verdict file (or of the failure file).
    value: ${{ steps.assure.outputs.verdict-path }}
  outcome:
    description: verdict, no_verdict, or the typed failure outcome.
    value: ${{ steps.assure.outputs.outcome }}
  exit-code:
    description: The verdict's policy exit (0 policy met or never, 1 policy failed, 3 nothing was checked or machines were refused), 2 bad input, 3 typed refusal or API failure.
    value: ${{ steps.assure.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: assure
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_ARTEFACTS: ${{ inputs.artefacts }}
        INPUT_CONNECTION: ${{ inputs.connection }}
        INPUT_COLLECTION_ROLE: ${{ inputs.collection-role }}
        INPUT_COLLECTION_PRIVILEGES: ${{ inputs.collection-privileges }}
        INPUT_DATA_DIR: ${{ inputs.data-dir }}
        INPUT_CONFIG_DIRS: ${{ inputs.config-dirs }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ALLOW_PARTIAL: ${{ inputs.allow-partial }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_SCOPE_BINDING: ${{ inputs.scope-binding }}
        INPUT_ACCEPTED_SCOPE_REF: ${{ inputs.accepted-scope-ref }}
        INPUT_IDENTITY_KEY: ${{ inputs.identity-key }}
        INPUT_OUTPUT: ${{ inputs.output }}
        ASSURE_PYTHON: ${{ inputs.python }}
      run: '"$ASSURE_PYTHON" -I -B "$GITHUB_ACTION_PATH/action/entry.py"'
